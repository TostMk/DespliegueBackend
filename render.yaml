databases:
  - name: rpg-db
    plan: free
    databaseName: rpg
    user: rpg_user

services:
  - type: web
    name: rpg-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --no-input
    startCommand: gunicorn rol_api.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rpg-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: AUTHORS
        value: '[{"nombre":"Miguel Angel Lank","codigo":"362917"}]'
